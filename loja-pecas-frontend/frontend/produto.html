<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peça — Recicla Hardware</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
  <div class="container topo-inner">
    <div class="logo"><a href="index.html" style="color:inherit"><span class="chip"></span> RECICLA HARDWARE</a></div>
    <nav class="topo-nav">
      <a href="carrinho.html">Carrinho (<span id="contador-carrinho">0</span>)</a>
      <span id="area-usuario"></span>
    </nav>
  </div>
</header>

<div class="container">
  <div class="pagina-produto" id="conteudo-produto">
    <p style="color:var(--texto-fraco)">Carregando...</p>
  </div>
</div>

<footer>Recicla Hardware — loja de peças de computador usadas.</footer>

<script src="js/api.js"></script>
<script>
function renderUsuario() {
  const usuario = pegarUsuario();
  const area = document.getElementById('area-usuario');
  area.innerHTML = usuario
    ? `<a href="pedidos.html">${usuario.nome.split(' ')[0]}</a> · <a href="#" onclick="sair();return false;">Sair</a>`
    : `<a href="login.html">Entrar</a> · <a href="cadastro.html">Cadastrar</a>`;
}

async function carregar() {
  const id = new URLSearchParams(window.location.search).get('id');
  const container = document.getElementById('conteudo-produto');
  try {
    const p = await api(`/produtos/${id}`);
    container.innerHTML = `
      <div class="imagem-grande">${p.imagem_url ? `<img src="${p.imagem_url}" alt="${p.titulo}">` : ''}</div>
      <div>
        <span class="condicao">${p.condicao}</span>
        <h1>${p.titulo}</h1>
        <p style="color:var(--texto-fraco)">${p.descricao || ''}</p>
        <div class="spec-linha"><span>Categoria</span><span>${p.categoria_nome || '—'}</span></div>
        <div class="spec-linha"><span>Estoque</span><span>${p.estoque} unidade(s)</span></div>
        <p class="preco" style="font-size:1.6rem;margin:20px 0">R$ ${Number(p.preco).toFixed(2)}</p>
        <button class="btn bloco" id="btn-add" ${p.estoque === 0 ? 'disabled' : ''}>
          ${p.estoque === 0 ? 'Fora de estoque' : 'Adicionar ao carrinho'}
        </button>
      </div>`;
    document.getElementById('btn-add')?.addEventListener('click', () => {
      adicionarAoCarrinho(p, 1);
      window.location.href = 'carrinho.html';
    });
  } catch (e) {
    container.innerHTML = '<p class="erro-msg">Peça não encontrada.</p>';
  }
}

renderUsuario();
carregar();
</script>
</body>
</html>
