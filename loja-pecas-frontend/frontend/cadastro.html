<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — Recicla Hardware</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
  <div class="container topo-inner">
    <div class="logo"><a href="index.html" style="color:inherit"><span class="chip"></span> RECICLA HARDWARE</a></div>
  </div>
</header>

<div class="form-card">
  <h2>Criar conta</h2>
  <form id="form-cadastro">
    <div class="campo"><label>Nome completo</label><input type="text" id="nome" required></div>
    <div class="campo"><label>Email</label><input type="email" id="email" required></div>
    <div class="campo"><label>Telefone</label><input type="text" id="telefone"></div>
    <div class="campo"><label>Senha</label><input type="password" id="senha" required minlength="6"></div>
    <button class="btn bloco" type="submit">Criar conta</button>
    <p id="msg-erro" class="erro-msg"></p>
  </form>
  <p style="margin-top:16px;color:var(--texto-fraco)">Já tem conta? <a href="login.html">Entrar</a></p>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgErro = document.getElementById('msg-erro');
  msgErro.textContent = '';
  try {
    const resposta = await api('/auth/cadastro', {
      method: 'POST',
      body: JSON.stringify({
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        telefone: document.getElementById('telefone').value,
        senha: document.getElementById('senha').value
      })
    });
    salvarSessao(resposta.usuario, resposta.token);
    window.location.href = 'index.html';
  } catch (e) {
    msgErro.textContent = e.message;
  }
});
</script>
</body>
</html>
